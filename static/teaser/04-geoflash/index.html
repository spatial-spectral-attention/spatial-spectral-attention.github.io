const showSkip = (on, a = null) => V.skip.forEach((row, aa) => row.forEach((c, r) => c.setAttribute('opacity', on && (a == null || a >= aa) && !D.support[aa].includes(r) ? 1 : 0)));
const moveTo = (node, x, y) => { node.style.transform = `translate(${x}px, ${y}px)`; node.setAttribute('opacity', 1); };
const hide = (...nodes) => nodes.forEach((x) => x.setAttribute('opacity', 0));
const dotsFor = (patches, style) => patches.map((a) => ({ kind: 's', a, ...style }));

function reset() {
  hide(V.rowCur, V.colCur, ...V.tiles, ...V.yCurs, V.yg, V.panel);
  showArcs(false); focus(null, []);
  V.coarse.setAttribute('opacity', 1); V.fine.setAttribute('opacity', 0);
  paintScores(0); showSupport(false); showSkip(false);
  V.vc.flat().forEach((c) => c.setAttribute('fill', '#fff')); V.yc.flat().forEach((c) => c.setAttribute('fill', '#fff'));
  N.setDots([]); M.setDots([]);
}

// ---------------------------------------------------------------- steps
let runToken = 0;
async function show(step) {
  const token = ++runToken, live = () => token === runToken;
  reset();
  if (step === 0) { V.head.textContent = ''; N.tintAll(TEAL, 0.16); M.tintAll(ORANGE, 0.16); return; }
  if (step === 1) {
    setText(V.head, 'Patch scores s_{ar}');
    panel('COARSE', INK, 'Score patch pairs', ['score', 's_{ar} = max_{i∈Aₐ} q_iᵀ μ_r', 'mean key of B_r', 'μ_r = mean_{j∈Bᵣ} k_j', 'time', 'O(n_N · |ℬ| · d)']);
    const mu = Array.from({ length: K }, (_, a) => ({ kind: 'c', a, r: 3.6, fill: INK }));
    paintScores(0); N.tintAll(TEAL, 0.4);
    for (let r = 0; r < K && live(); r++) {
      M.tintAll(ORANGE, 0.1); M.tint(r, ORANGE, 0.85);
      M.setDots(mu.map((d, i) => (i === r ? { ...d, r: 5.2, fill: ORANGE } : d)));
      moveTo(V.colCur, r * BS, 0); focus(null, [r]); lightRows(true); paintScores(r + 1);
      await sleep(650);
    }
    if (!live()) return;
    hide(V.colCur); focus(null, []);
    N.tintAll(TEAL, 0.16); M.tintAll(ORANGE, 0.16); M.setDots(mu);
    return;
  }
  if (step === 2) {
    setText(V.head, `Top-${R} source patches per row`);
    paintScores(K);
    panel('SUPPORT', TEAL_TEXT, `Keep top-${R} per patch`, ['budget', `R = ${R} of ${K} source patches`, 'why it works', 'attention mass is block-sparse', 'selection is cheap', 'no vertex pair evaluated yet']);
    const cs = (list) => list.map((a) => ({ kind: 'c', a, r: 4.2, fill: ORANGE }));
    for (let a = 0; a < K && live(); a++) {
      N.tintAll(TEAL, 0.1); N.tint(a, TEAL, 0.85);
      M.tintAll(ORANGE, 0.08); D.support[a].forEach((r) => M.tint(r, ORANGE, 0.85));
      N.setDots([{ kind: 'c', a, r: 4.2, fill: TEAL }]); M.setDots(cs(D.support[a]));
      moveTo(V.rowCur, 0, a * BS); focus(a, D.support[a]);
      showSupport(true, a); showSkip(true, a);
      await sleep(900);
    }
    return;
  }
  if (step === 3) {
    setText(V.head, 'Exact softmax on the support');
    showSupport(true); showSkip(true);
    V.coarse.setAttribute('opacity', 0); V.fine.setAttribute('opacity', 1); V.yg.setAttribute('opacity', 1);
    panel('EXACT ON SUPPORT', TEAL_TEXT, 'Geo-FlashAttention', ['time', 'O(n_N · R · m_{max} · (d + k))', 'memory', 'O(n_N + R · m_{max})', 'tiles', `${K * R} of ${K * K} patch pairs`], 172);
    for (let r = 0; r < K; r++) M.tint(r, PAL[r], 0.38);
    N.tintAll('#ffffff', 0); N.setDots([]); M.setDots([]);
    await sleep(700);
    if (!live()) return;
    const acc = Array.from({ length: D.nv }, () => ({ m: -Infinity, l: 0, o: Array(D.k).fill(0) }));
    N.tintAll(TEAL, 0.8);
    V.yCurs.forEach((y, a) => moveTo(y, 0, a * BS));
    lightRows(true);
    for (let t = 0; t < R && live(); t++) {
      const active = D.support.map((sup) => sup[t]);
      const used = [...new Set(active)];
      V.colLbl.forEach((x, r) => (x.style.fill = used.includes(r) ? ORANGE_TEXT : ''));
      for (let rr = 0; rr < K; rr++) M.tint(rr, PAL[rr], used.includes(rr) ? 0.95 : 0.22);
      M.setDots(dotsFor(used, { r: 3.2, fill: '#fff' }));
      for (let a = 0; a < K; a++) {
        const r = active[a];
        moveTo(V.tiles[a], r * BS, a * BS);
        for (let i = a * P; i < a * P + P; i++) {
          const rowMax = Math.max(...D.Ageo[i]);
          for (let j = r * P; j < r * P + P; j++) V.vc[i][j].setAttribute('fill', greyFill(D.Ageo[i][j] / rowMax));
          const st = acc[i], blk = D.logits[i].slice(r * P, r * P + P);
          const mNew = Math.max(st.m, ...blk), sc = Math.exp(st.m - mNew);
          st.l *= sc; st.o = st.o.map((x) => x * sc);
          blk.forEach((x, tt) => { const p = Math.exp(x - mNew); st.l += p; st.o = st.o.map((o, c) => o + p * D.V[r * P + tt][c]); });
          st.m = mNew;
          st.o.forEach((o, c) => V.yc[i][c].setAttribute('fill', vFill(o / st.l)));
        }
      }
      await sleep(1400);
    }
    if (!live()) return;
    for (let a = 0; a < K; a++) N.tint(a, PAL[D.match[a]], 0.75);
    hide(...V.tiles, ...V.yCurs); focus(null, []); N.setDots([]); M.setDots([]);
    for (let r = 0; r < K; r++) M.tint(r, PAL[r], 0.75);
    // matched pairs: 3D arcs between patch centres (world-space tubes)
    showArcs(true);
    N.setDots(D.match.map((m, a) => ({ kind: 'c', a, r: 3, fill: PAL[m] }))); M.setDots(Array.from({ length: K }, (_, r) => ({ kind: 'c', a: r, r: 3, fill: PAL[r] })));
  }
}

// ---------------------------------------------------------------- responsive stage and controls
const captions = [
  'Illustrative example with eight patches per cortex and three sampled vertices per patch.',
  'For each target patch, score each source patch using its mean key and the best query.',
  'For each target patch, keep the two highest-scoring source patches.',
  'Stream the selected pairs and compute exact softmax over their vertices.'
];
const buttons = [...document.querySelectorAll('#stages button')];
const advance = document.getElementById('advance');
const replay = document.getElementById('replay');
let cur = -1;

function go(step, restart = false) {
  if (!Number.isInteger(step) || step < 0 || step >= buttons.length || (step === cur && !restart)) return;
  cur = step;
  buttons.forEach((button, i) => button.setAttribute('aria-pressed', String(i === cur)));
  caption.textContent = captions[cur];
  advance.textContent = cur === buttons.length - 1 ? 'Restart' : 'Continue';
  replay.disabled = cur === 0 || motion.matches;
  show(cur);
}

buttons.forEach((button, i) => {
  button.disabled = false;
  button.addEventListener('click', () => go(i));
});
advance.disabled = false;
advance.addEventListener('click', () => go((cur + 1) % buttons.length));
replay.addEventListener('click', () => go(cur, true));
document.getElementById('stages').addEventListener('keydown', (event) => {
  if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
  const next = cur + (event.key === 'ArrowLeft' ? -1 : 1);
  if (!buttons[next]) return;
  event.preventDefault();
  go(next);
  buttons[next].focus();
});
window.demo = { step: go, get current() { return cur; } };

const stage = document.getElementById('stage');
function fit() {
  root.style.transform = `scale(${stage.clientWidth / (W * F)})`;
}
new ResizeObserver(() => {
  fit();
  report('resize');
}).observe(demo);
fit();
const initial = Number(Qs.get('step'));
go(buttons[initial] ? initial : 0);
report('ready');
}
</script></body></html>
